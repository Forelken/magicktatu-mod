plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.runetouched'

base {
    archivesName = 'runetouched'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                runetouched {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'runetouched'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'runetouched'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.5'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "runetouched",
                "Specification-Vendor"    : "runetouched",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "runetouched"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
